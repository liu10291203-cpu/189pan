name: 天翼云盘签到

on:
  schedule:
    # 北京时间 09:30 / 20:30
    - cron: "30 1 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check today's status
        id: check
        run: |
          TODAY=$(date +%Y/%m/%d)
          if [ "${{ github.event_name }}" = "schedule" ] && grep -q "最后更新:.*$TODAY" index.md && grep -Eq "成功账户：([0-9]+)/\1" index.md; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "今天已确认签到成功，跳过本次运行"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.check.outputs.already != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.already != 'true'
        run: npm ci

      - name: Run check-in
        if: steps.check.outputs.already != 'true'
        env:
          TYYP_USERNAME: ${{ secrets.TYYP_USERNAME }}
          TYYP_PSW: ${{ secrets.TYYP_PSW }}
          TYYP_SSON: ${{ secrets.TYYP_SSON }}
        run: node checkin.js

      - name: Commit result
        if: success() && steps.check.outputs.already != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 自动签到更新"
          file_pattern: index.md
