name: 天翼云盘签到

on:
  schedule:
    # 北京时间 09:30 / 20:30
    - cron: "30 1 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run check-in
        env:
          TYYP_USERNAME: ${{ secrets.TYYP_USERNAME }}
          TYYP_PSW: ${{ secrets.TYYP_PSW }}
          TYYP_SSON: ${{ secrets.TYYP_SSON }}
        run: node checkin.js

      - name: Commit result
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 自动签到更新"
          file_pattern: index.md
